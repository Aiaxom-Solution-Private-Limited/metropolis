services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metropolis_frontend
    ports:
      - "3005:3005"
    volumes:
      - ./frontend/public:/app/public
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5005/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metropolis_backend
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/metropolis_dental
      - JWT_SECRET=metropolis_luxury_secret_key_2026
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: metropolis_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
