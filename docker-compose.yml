services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metropolis_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload
    ports:
      - "5005:5000"
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/public:ro
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metropolis_frontend
    restart: always
    ports:
      - "3005:3005"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5005/api
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
